<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b33">
<title>Scapula | تشريح | VetCommitto</title>
<link rel="icon" href="logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b33;--purple:#1e3f70;--violet:#2b5696;--ink:#1a2233;--slate:#606d85;--paper:#f5f7fa;--line:#e2e6ed;--white:#fff;--gold:#d1aa5c;--card:#fff;--cb:#dfe3ed;--btn:#f0f3f7;--mut:#8893a4;--nav:#fbfbfd}
[data-theme=dark]{--navy:#e0e5ed;--purple:#8baccf;--violet:#a8bcd9;--ink:#e0e5ed;--slate:#949daf;--paper:#0b1120;--line:#334155;--white:#0f172a;--card:#1e293b;--cb:#334155;--btn:#334155;--mut:#949daf;--nav:#0f172a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.8 "IBM Plex Sans Arabic",Tahoma,sans-serif;transition:background .3s,color .3s;padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.lt{font-family:Manrope,sans-serif}
.wrap{width:min(1100px,calc(100% - 40px));margin-inline:auto}

.top{height:68px;background:var(--nav);border-bottom:1px solid var(--line);display:flex;align-items:center}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#0d1b33}
.brand b{font-size:14px;color:var(--navy);font-weight:700;line-height:1.4}.brand small{display:block;color:var(--slate);font-size:10px;font-weight:500}
.tools{display:flex;gap:8px}
.ib{height:40px;min-width:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;padding:0 14px;font-size:12px;font-weight:600;transition:.2s}
.ib:hover{background:var(--btn)}

.band{position:relative;overflow:hidden;background:linear-gradient(110deg,#0d1b33,#152c50 55%,#1e3f70);color:#fff;padding:34px 0 62px}
.band:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 90% 0,rgba(209,170,92,.2),transparent 50%);pointer-events:none}
.band .wrap{position:relative;z-index:1}
.band .k{color:var(--gold);font-size:13px;font-weight:600;margin-bottom:6px}
.band h1{margin:0;font:800 clamp(34px,7vw,56px)/1.15 Manrope,sans-serif;letter-spacing:-.02em}
.band p{margin:10px 0 0;color:#c9d3e6;max-width:520px;font-size:14px}
.main{position:relative;z-index:2;margin-top:-30px;padding-bottom:60px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:9px 18px;color:var(--slate);font-size:13px;font-weight:600;transition:.2s}
.chip:hover{border-color:var(--purple)}.chip.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
.chip small{font:500 11px Manrope,sans-serif;opacity:.75;margin-inline-start:6px}

.grid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.plate{background:#fafaff;border:1px solid var(--cb);border-radius:20px;padding:26px 16px;display:grid;place-items:center;min-height:300px}
.stage{position:relative;margin:auto}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid #0d1b33;background:var(--gold);padding:0;transition:transform .2s,background .2s}
.hs:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:ping 2.4s ease-out infinite}
.hs:hover{transform:scale(1.15)}
.hs.on{background:#0d1b33;border-color:var(--gold);transform:scale(1.15)}.hs.on:after{animation:none;opacity:.9}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

.info{position:sticky;top:14px;background:var(--card);border:1px solid var(--cb);border-radius:20px;padding:22px}
.info .e{font:800 22px/1.3 Manrope,sans-serif;color:var(--navy);direction:ltr;text-align:right;margin:0 0 10px}
.info p{margin:0;color:var(--slate);font-size:14px;line-height:1.95}
.info .hint{display:flex;align-items:center;gap:10px;color:var(--slate)}
.info .hint i{width:26px;height:26px;flex:none;border-radius:50%;background:var(--gold);border:2px solid #0d1b33}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.parts .chip{padding:6px 12px;font:600 12px Manrope,sans-serif;direction:ltr}

.credit{margin-top:22px;font-size:12px;color:var(--mut)}
footer{background:#0b1526;color:#a2aac0;padding:30px 0;font-size:11px}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}

@media(max-width:860px){.grid{grid-template-columns:1fr}.info{position:static}.plate{padding:18px 8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hs:after{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html"><img src="logo.jpeg" alt="شعار لجنة الطب البيطري" onerror="this.style.display='none'"><span><b>المنصة الأكاديمية - VetCommitto</b><small>لجنة الطب والجراحة البيطرية</small></span></a>
  <div class="tools">
    <a class="ib" href="index.html">الرئيسية</a>
    <button class="ib" id="th" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</div></header>

<div class="band"><div class="wrap">
  <div class="k">تشريح</div>
  <h1>Scapula</h1>
  <p>عظمة اللوح (الكتف) من كل جهاتها. اختر الجهة، واضغط على النقاط الذهبية لتعرف كل جزء.</p>
</div></div>

<main class="wrap main">
  <div class="tabs" id="tabs" role="tablist" aria-label="جهات العظمة"></div>
  <div class="grid">
    <div class="plate"><div class="stage" id="stage"></div></div>
    <aside class="info" aria-live="polite">
      <div id="card"></div>
      <div class="parts" id="parts"></div>
    </aside>
  </div>
  <p class="credit">الصور والشرح: إعداد سعاد صالح، لجنة الطب والجراحة البيطرية.</p>
</main>

<footer><div class="wrap"><span>المنصة الأكاديمية - VetCommitto</span><span class="lt">JUST · JORDAN</span></div></footer>

<script>
// الصور بمجلد scapula/ . الإحداثيات x و y نسبة مئوية من الصورة، عدّلها لو بدك تحرّك أي نقطة.
const VIEWS=[
 {id:"lateral",ar:"جانبي",en:"Lateral",w:306,ratio:403/738,parts:[
  ["Dorsal border",52,4,"متجه للأعلى."],
  ["Cranial angle",19,7,"الزاوية العلوية من جهة الرأس."],
  ["Caudal angle",95,10,"الزاوية العلوية من جهة الذيل."],
  ["Cranial border",6,41,"منحني ومتجه لجهة الرأس، ودايماً بتكون thin."],
  ["Caudal border",95,30,"مستقيم (مش منحني زي الـ cranial)، وبكون thick."],
  ["Scapular spine",51,22,"بروز كبير بكون لبرا (laterally)، وبيقسم العظمة لنصين: supra يعني فوق، و infra يعني تحت. السبب إنه العظمة مايلة مش مستقيمة، فالـ spine بتقسمها لجزء فوقها وجزء تحتها (مش يمينها وشمالها)."],
  ["Supraspinous fossa",27,45,"موقع ارتباط عضلة supraspinatus. كلمة fossa بتعني انخفاض في العظمة، بس مافي مفصل."],
  ["Infraspinous fossa",72,36,"بترتبط هون عضلة infraspinatus."],
  ["Scapular notch",37,78,"انحناء في الـ cranial border نفسه."],
  ["Neck",52,83,"لو اعتبرنا إنه هاد الجزء كله head، إذاً لازم يكون عنا neck؛ هاد الجزء هو الـ neck."],
  ["Acromion",69,87,"جزء موجود في نهاية الـ spine (ventrally)، وبكون إله انحناء رايح caudally."],
  ["Ventral angle",50,95,"زاوية منتخيلها، لأنه الجزء السفلي للعظمة مش عامل زاوية بشكل كامل."]]},
 {id:"medial",ar:"وسطي",en:"Medial",w:308,ratio:425/800,parts:[
  ["Subscapular fossa",27,38,"انحناء في الجهة الـ medial من الـ scapula، بترتبط فيه عضلة subscapularis."],
  ["Serrated face",59,9,"سطح خشن بترتبط فيه عضلة serratus ventralis."]]},
 {id:"cranial",ar:"أمامي",en:"Cranial",w:150,ratio:119/369,parts:[
  ["Cranial border",50,42,"منحني ومتجه لجهة الرأس، ودايماً بتكون thin."]]},
 {id:"caudal",ar:"خلفي",en:"Caudal",w:150,ratio:126/370,parts:[
  ["Caudal border",50,45,"مستقيم (مش منحني زي الـ cranial)، وبكون thick."]]},
 {id:"dorsal",ar:"علوي",en:"Dorsal",w:520,ratio:282/66,parts:[
  ["Dorsal border",50,50,"متجه للأعلى."]]},
 {id:"ventral",ar:"سفلي",en:"Ventral",w:540,ratio:502/331,parts:[
  ["Supraglenoid tubercle",28,66,"في الجزء الـ cranial."],
  ["Infraglenoid tubercle",66,56,"في الجزء الـ caudal."],
  ["Glenoid cavity",47,72,"تجويف في نهاية العظمة، مهم لأنه بيرتبط بالعظمة اللي بعدها: humerus."],
  ["Coracoid process",22,80,"الجزء البارز في النهاية، وبترتبط عليه عضلة coracobrachialis."]]}
];
const $=id=>document.getElementById(id);
let cur=0,sel=-1;
function mk(t,x,c){const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e}

function theme(){const d=localStorage.getItem("vet_theme")==="dark";document.documentElement.dataset.theme=d?"dark":"light";document.querySelector('meta[name=theme-color]').content=d?"#0b1120":"#0d1b33"}
$("th").onclick=()=>{localStorage.setItem("vet_theme",localStorage.getItem("vet_theme")==="dark"?"light":"dark");theme()};
theme();

function tabs(){
  const t=$("tabs");t.textContent="";
  VIEWS.forEach((v,i)=>{const b=mk("button",v.ar,"chip"+(i===cur?" on":""));b.append(mk("small",v.en));
    b.setAttribute("role","tab");b.setAttribute("aria-selected",i===cur);b.onclick=()=>{cur=i;sel=-1;tabs();draw()};t.append(b)});
}
function draw(){
  const v=VIEWS[cur],st=$("stage");st.textContent="";
  st.style.width="min(100%,"+v.w+"px)";
  const img=document.createElement("img");img.src=v.id+".jpg";img.alt="Scapula، الجهة "+v.ar;st.append(img);
  v.parts.forEach((p,i)=>{const b=mk("button",null,"hs"+(i===sel?" on":""));b.style.left=p[1]+"%";b.style.top=p[2]+"%";
    b.setAttribute("aria-label",p[0]);b.onclick=()=>pick(i);st.append(b)});
  const pl=$("parts");pl.textContent="";
  v.parts.forEach((p,i)=>{const b=mk("button",p[0],"chip"+(i===sel?" on":""));b.onclick=()=>pick(i);pl.append(b)});
  card();
}
function card(){
  const c=$("card");c.textContent="";const p=VIEWS[cur].parts[sel];
  if(!p){const h=mk("div",null,"hint");h.append(mk("i"),mk("span","اضغط على أي نقطة ذهبية بالصورة، أو اختر الجزء من القائمة تحت."));c.append(h);return}
  c.append(mk("h2",p[0],"e"),mk("p",p[3]));
}
function pick(i){sel=i;document.querySelectorAll(".hs").forEach((b,j)=>b.classList.toggle("on",j===i));
  document.querySelectorAll("#parts .chip").forEach((b,j)=>b.classList.toggle("on",j===i));card();
  if(innerWidth<=860)$("card").scrollIntoView({behavior:"smooth",block:"nearest"})}
tabs();draw();
</script>
</body>
</html>
